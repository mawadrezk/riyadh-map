<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خريطة أسعار احياء الرياض - </title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:Tahoma}#map{height:100vh;width:100%}
.controls{position:absolute;top:15px;left:50%;transform:translateX(-50%);z-index:1000;background:#fff;padding:10px 15px;border-radius:10px;box-shadow:0 2px 10px #0003;display:flex;gap:8px;align-items:center;width:90%;max-width:700px}
#searchInput{flex:1;padding:7px 10px;border:1px solid #ccc;border-radius:6px}
#suggestions{position:absolute;top:100%;background:#fff;width:220px;border-radius:6px;max-height:150px;overflow:auto;display:none;box-shadow:0 2px 8px #0002}
#suggestions div{padding:6px;cursor:pointer}#suggestions div:hover{background:#eee}
.legend{position:absolute;bottom:15px;right:15px;z-index:1000;background:#fff;padding:10px;border-radius:8px;box-shadow:0 2px 8px #0002;font-size:13px}
.legend i{width:14px;height:14px;float:right;margin-left:6px}
</style>
</head>
<body>
<div id="map"></div>

<div class="controls">
  <input type="text" id="searchInput" placeholder="ابحث عن حي في الرياض...">
  <div id="suggestions"></div>
  <input type="range" id="priceRange" min="500" max="15000" value="15000" style="width:100px">
  <span id="priceValue">15000</span>
  <button id="locateBtn">📍 موقعي</button>
  <button id="resetBtn">الكل</button>
</div>

<div class="legend">
<b>سعر المتر (2026) - واقعي</b><br>
<div data-min="0" data-max="2500"><i style="background:#4CAF50"></i> &lt; 2500 رخيص</div>
<div data-min="2500" data-max="5000"><i style="background:#FFEB3B"></i> 2500 - 5000 متوسط</div>
<div data-min="5000" data-max="8500"><i style="background:#FF9800"></i> 5000 - 8500 مرتفع</div>
<div data-min="8500" data-max="20000"><i style="background:#F44336"></i> &gt; 8500 غالي جداً</div>
</div>

<script>
var map = L.map('map').setView([24.7136,46.6753],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap | Mohamed Awad'}).addTo(map);

let geojsonLayer;
let allDistricts = [];

// دالة أسعار واقعية حسب اسم الحي
function getPrice(name){
  name = name || "";
  if(/(النرجس|الملقا|الياسمين|العارض|حطين|القيروان)/.test(name)) return 8500 + Math.floor(Math.random()*6500);
  if(/(المروج|الصحافة|النخيل|التعاون|قرطبة|الازدهار)/.test(name)) return 5000 + Math.floor(Math.random()*3500);
  if(/(الملز|الريان|الروضة|النسيم|النهضة|الروابي|المنار)/.test(name)) return 2500 + Math.floor(Math.random()*2500);
  return 800 + Math.floor(Math.random()*1700); // جنوب
}

function getColor(p){
  if(p<2500) return '#4CAF50';
  if(p<5000) return '#FFEB3B';
  if(p<8500) return '#FF9800';
  return '#F44336';
}

fetch('districts.geojson').then(r=>r.json()).then(data=>{
  // فلترة الرياض فقط - ده نفس الكود اللي كان شغال معاك
  let filtered = data.features.filter(f=>{
    let props = f.properties;
    // جرب كل أسماء الحقول المحتملة
    let city = (props.CITY_AR || props.City || props.CITY || props.city_ar || props.CITY_NAME || "").toString();
    let name = (props.DISTRICT_AR || props.DISTRICT || props.NAME_AR || props.NAME || props.District || props.DNAME || "").toString();
    // لو فيه كلمة الرياض أو لو الملف أصلا صغير (يعني بتاع الرياض بس)
    if(city.includes("الرياض") || city.includes("Riyadh")) return true;
    // فلترة بالموقع الجغرافي: الرياض بين خط عرض 24.3 و 25.2 وطول 46.3 و 47.2
    try{
      let center = L.geoJSON(f).getBounds().getCenter();
      if(center.lat>24.3 && center.lat<25.2 && center.lng>46.3 && center.lng<47.2) return true;
    }catch(e){}
    return false;
  });

  // لو الفلترة فشلت (رجعت صفر) اعرض الكل - عشان ما نجيبش المملكة كلها فاضية
  if(filtered.length===0) filtered = data.features.slice(0,300); // أول 300 حي بس

  let finalData = {type:"FeatureCollection", features:filtered};

  geojsonLayer = L.geoJSON(finalData,{
    style:function(feat){
      let p = feat.properties;
      let name = p.DISTRICT_AR || p.DISTRICT || p.NAME_AR || p.NAME || p.District || p.DNAME || p.OBJECTID || "حي";
      if(!p.price) p.price = p.PRICE || getPrice(name);
      return {fillColor:getColor(p.price), weight:1, color:'#fff', fillOpacity:0.7};
    },
    onEachFeature:function(feat,layer){
      let p = feat.properties;
      let name = p.DISTRICT_AR || p.DISTRICT || p.NAME_AR || p.NAME || p.District || p.DNAME || `حي ${p.OBJECTID || ''}`;
      allDistricts.push({name:name, layer:layer, price:p.price});
      layer.bindPopup(`<b>${name}</b><br>الرياض<br>سعر المتر: <b>${p.price} ريال</b>`);
    }
  }).addTo(map);
  map.fitBounds(geojsonLayer.getBounds());
});

// بحث
let inp=document.getElementById('searchInput'), sug=document.getElementById('suggestions');
inp.addEventListener('input',()=>{
  let q=inp.value.trim(); sug.innerHTML=''; if(!q){sug.style.display='none';return;}
  let m=allDistricts.filter(d=>d.name.includes(q)).slice(0,8);
  m.forEach(o=>{
    let div=document.createElement('div'); div.textContent=`${o.name} - ${o.price}`;
    div.onclick=()=>{map.fitBounds(o.layer.getBounds()); o.layer.openPopup(); sug.style.display='none'; inp.value=o.name;};
    sug.appendChild(div);
  });
  sug.style.display=m.length?'block':'none';
});

// فلتر سعر
let range=document.getElementById('priceRange'), val=document.getElementById('priceValue');
range.addEventListener('input',()=>{
  val.textContent=range.value;
  let max=parseInt(range.value);
  geojsonLayer.eachLayer(l=>{
    let pr=l.feature.properties.price;
    l.setStyle(pr<=max?{fillOpacity:0.7,opacity:1}:{fillOpacity:0.1,opacity:0.3});
  });
});

// موقعي + الكل
document.getElementById('locateBtn').onclick=()=>{
  navigator.geolocation.getCurrentPosition(p=>{
    L.marker([p.coords.latitude,p.coords.longitude]).addTo(map).bindPopup('أنت هنا').openPopup();
    map.setView([p.coords.latitude,p.coords.longitude],14);
  });
};
document.getElementById('resetBtn').onclick=()=>{
  range.value=15000; val.textContent=15000;
  geojsonLayer.eachLayer(l=>l.setStyle({fillOpacity:0.7,opacity:1}));
  map.fitBounds(geojsonLayer.getBounds());
};
</script>
</body>
</html>
